
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Login | Digital Production Request</title>

  <style>
   
.dashboard-link {
  display: block;
  margin-top: 20px;
  padding: 13px;
  background: #142d4e;
  color: white;
  text-align: center;
  text-decoration: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: bold;
}

.dashboard-link:hover {
  background: #187f9d;
}

    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #eef3f8;
      font-family: Arial, sans-serif;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px #00000012;
    }

    h2 {
      color: #142d4e;
      margin-bottom: 10px;
    }

    p {
      color: #526173;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd5e0;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      background: #187f9d;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
    }

    #userPanel {
      display: none;
    }
  </style>
</head>

<body>
  <div class="login-box">

    <h2>Digital Production Request</h2>
    <p>Staff & Logistic Login</p>

    <form id="loginForm">
      <label for="email">Email Address</label>
      <input type="email" id="email"
             autocomplete="username" required>

      <label for="password">Password</label>
      <input type="password" id="password"
             autocomplete="current-password" required>

      <button type="submit" id="loginButton">
        Login
      </button>
    </form>

   
<div id="userPanel">
  <h3>Login Successful</h3>
  <p id="userInfo"></p>

  <a href="index.html" class="dashboard-link">
    Go to Dashboard
  </a>

  <button id="logoutButton">Logout</button>
</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // REPLACE WITH YOUR OWN SUPABASE DETAILS

    const projectUrl = "https://swyzpswrncaghdfnphhc.supabase.co";
    const publishableKey = "sb_publishable_Rek9NATddqXIwNN0UQ6cUw_Iuh5aRoE";

    const db = window.supabase.createClient(
      projectUrl,
      publishableKey
    );

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const userPanel = document.getElementById("userPanel");
    const userInfo = document.getElementById("userInfo");
    const loginButton = document.getElementById("loginButton");

    async function showUser(user) {
      const { data, error } = await db
        .from("profiles")
        .select("role, staff_id, full_name")
        .eq("id", user.id)
        .single();

      if (error) {
        message.textContent = "Profile error: " + error.message;
        return;
      }

      form.style.display = "none";
      userPanel.style.display = "block";

      userInfo.textContent =
        "Email: " + user.email +
        " | Role: " + data.role;

      message.textContent = "";
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      loginButton.disabled = true;
      message.textContent = "Checking login...";

      try {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const { data, error } = await db.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          message.textContent = error.message;
          return;
        }

        await showUser(data.user);

      } catch (error) {
        message.textContent = "Login error: " + error.message;
      } finally {
        loginButton.disabled = false;
      }
    });

    document.getElementById("logoutButton")
      .addEventListener("click", async function () {
        const { error } = await db.auth.signOut();

        if (error) {
          message.textContent = error.message;
          return;
        }

        userPanel.style.display = "none";
        form.style.display = "block";
        form.reset();
        message.textContent = "Logged out successfully.";
      });

    async function checkSession() {
      try {
        const { data, error } = await db.auth.getUser();

        if (error || !data.user) return;

        await showUser(data.user);
      } catch (error) {
        message.textContent = "Connection error: " + error.message;
      }
    }

    checkSession();
  </script>
</body>
</html>
